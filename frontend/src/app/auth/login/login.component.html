<div class="container-fluid d-flex flex-column justify-content-center align-items-center" style="background: #43698f; ">
    <h1>Angular <span class="gradient-text">Developer Event</span></h1>
    <div class="release-tag">
        <span class="bracket">&#123;&#123;</span>
        <span class="version">v19 Release</span>
        <span class="bracket">&#125;&#125;</span>
    </div>
   
        <button (click)="showDialog()" class="btn btn-light rounded-button">
            <i class="pi pi-user"></i> Sign in with Credential
        </button>
        <form [formGroup]="userDetail" (ngSubmit)="login()">
            <p-dialog header="Sign in" [(visible)]="visible" [style]="{width: '25rem'}">
                <div class="form-group">
                    <input type="email" formControlName="email" class="form-control" id="email" placeholder="Email" required />
                </div>
                <div class="form-group mt-3">
                    <input type="password" formControlName="password" class="form-control" id="password" placeholder="Password" required />
                </div>
                <div class="mt-3 text-end">
                    <a (click)="redirectResetPassword()" class="link">
                        Forgot your password?
                    </a>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
                <div class="mt-3 text-center">
                    Don't have an account?
                    <a (click)="redirectRegister()" class="link">
                        Register
                    </a>
                </div>
            </p-dialog>
        </form>
   
</div>
