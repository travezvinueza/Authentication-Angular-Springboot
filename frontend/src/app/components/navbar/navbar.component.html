<nav class="navbar navbar-expand-lg" style="background-color: #3a3335">
    <div class="container-fluid ">

        <button class="logo" (click)="toggleSidebar()">
            <span class="fa fa-bars"></span>
        </button>

        <form class="d-flex ">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" *ngIf="!isAuthenticate">
                    <a class="nav-link" routerLink="/auth/login">Login</a>
                </li>
                <li class="nav-item" *ngIf="!isAuthenticate">
                    <a class="nav-link" routerLink="/auth/register">Register</a>
                </li>
                <li class="nav-item" *ngIf="isAuthenticate">
                    <a class="nav-link" routerLink="/auth/setting">Setting</a>
                </li>
                <li class="fas fa-bell fa-2x" *ngIf="isAuthenticate">
                    <span class="badge rounded-pill badge-notification bg-danger" *ngIf="notificationCount > 0">
                        {{ notificationCount }}
                      </span>
                      
                </li>
                
            </ul>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item d-flex align-items-center dropdown" *ngIf="isAuthenticate">
                    <!-- Contenedor del botón con imagen -->
                    <button class="btn p-0 border-0 bg-transparent d-flex align-items-center" id="userMenu"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <img [src]="userImage" class="rounded-circle me-2"
                            style="width: 40px; height: 40px; cursor: pointer;" alt="Profile" />
                    </button>
                    <!-- Menú desplegable -->
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                        <li>
                            <a class="dropdown-item" style="cursor: pointer;" (click)="redirectToProfile()">Profile</a>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <a class="dropdown-item" style="cursor: pointer; color: red" (click)="logout()">Logout</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </form>
    </div>
</nav>
